server.port: 8097
spring:
    application.name: notification-service
    data.redis.host: ${SPRING_REDIS_HOST:redis}
    data.redis.port: 6379
    data.mongodb.uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongo:27017/notificationdb}
    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer:
            group-id: notification-service
            key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            properties.spring.json.trusted.packages: "*"
eureka.client.serviceUrl.defaultZone: ${EUREKA_SERVER:http://discovery-server:8761/eureka}
eureka.instance.prefer-ip-address: true
springdoc.api-docs.path: /v3/api-docs
# Let an in-flight request finish before the JVM exits on SIGTERM (docker stop /
# rolling restarts), instead of the socket being torn down mid-response.
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
