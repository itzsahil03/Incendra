server.port: 8092
spring:
  application.name: org-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/orgdb}
    username: ${SPRING_DATASOURCE_USERNAME:incidentops}
    password: ${SPRING_DATASOURCE_PASSWORD:incidentops}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
eureka.client.serviceUrl.defaultZone: ${EUREKA_SERVER:http://discovery-server:8761/eureka}
eureka.instance.prefer-ip-address: true
springdoc.api-docs.path: /v3/api-docs
# Let an in-flight request finish before the JVM exits on SIGTERM (docker stop /
# rolling restarts), instead of the socket being torn down mid-response.
server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s
